name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
          check-latest: true

      - name: Remove impacted roots from CI JDK truststore
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          : "${GITHUB_ENV:?GITHUB_ENV is required}"
          source_store="$JAVA_HOME/lib/security/cacerts"
          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/javac"
          test -f "$source_store"
          test -r "$source_store"

          # Modify only a private, writable copy; this is runner-local Java TLS hardening
          # and does not alter Android app trust or the runner's cached JDK.
          truststore="$(mktemp "$RUNNER_TEMP/ci-cacerts.XXXXXX")"
          cp -- "$source_store" "$truststore"
          chmod u+rw "$truststore"

          cat >"$RUNNER_TEMP/RemoveImpactedTrustAnchors.java" <<'JAVA'
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.security.KeyStore;
          import java.security.cert.Certificate;
          import java.security.cert.X509Certificate;
          import java.util.ArrayList;
          import java.util.Enumeration;
          import java.util.List;
          import java.util.Set;
          import javax.security.auth.x500.X500Principal;

          public final class RemoveImpactedTrustAnchors {
              private static final char[] PASSWORD = "changeit".toCharArray();
              private static final Set<String> TARGET_SUBJECTS = Set.of(
                  "cn=emsign ecc root ca - g3,o=emudhra technologies limited,ou=emsign pki,c=in",
                  "cn=aaa certificate services,o=comodo ca limited,l=salford,st=greater manchester,c=gb"
              );

              private static String storeType(Path path) throws IOException {
                  try (InputStream input = Files.newInputStream(path)) {
                      byte[] header = input.readNBytes(4);
                      if (header.length == 4
                              && header[0] == (byte) 0xfe && header[1] == (byte) 0xed
                              && header[2] == (byte) 0xfe && header[3] == (byte) 0xed) {
                          return "JKS";
                      }
                      if (header.length > 0 && (header[0] & 0xff) == 0x30) {
                          return "PKCS12";
                      }
                      throw new IOException("Unsupported or corrupt Java truststore format");
                  }
              }

              private static KeyStore load(Path path, String type) throws Exception {
                  KeyStore store = KeyStore.getInstance(type);
                  try (InputStream input = Files.newInputStream(path)) {
                      store.load(input, PASSWORD);
                  }
                  int certificates = 0;
                  for (Enumeration<String> aliases = store.aliases(); aliases.hasMoreElements();) {
                      if (store.getCertificate(aliases.nextElement()) != null) certificates++;
                  }
                  if (certificates == 0) throw new IOException("Truststore contains no certificates");
                  return store;
              }

              private static boolean isTarget(Certificate certificate) {
                  return certificate instanceof X509Certificate x509
                      && TARGET_SUBJECTS.contains(x509.getSubjectX500Principal()
                          .getName(X500Principal.CANONICAL));
              }

              private static int removeTargets(KeyStore store) throws Exception {
                  int removed = 0;
                  List<String> aliasesToRemove = new ArrayList<>();
                  for (Enumeration<String> aliases = store.aliases(); aliases.hasMoreElements();) {
                      String alias = aliases.nextElement();
                      if (isTarget(store.getCertificate(alias))) aliasesToRemove.add(alias);
                  }
                  for (String alias : aliasesToRemove) {
                      store.deleteEntry(alias);
                      removed++;
                  }
                  return removed;
              }

              private static void verifyAbsent(KeyStore store) throws Exception {
                  for (Enumeration<String> aliases = store.aliases(); aliases.hasMoreElements();) {
                      if (isTarget(store.getCertificate(aliases.nextElement()))) {
                          throw new IOException("An impacted trust anchor remains in the truststore");
                      }
                  }
              }

              public static void main(String[] args) throws Exception {
                  if (args.length != 1) throw new IllegalArgumentException("Expected truststore path");
                  Path path = Path.of(args[0]);
                  String type = storeType(path);
                  KeyStore store = load(path, type);
                  int removed = removeTargets(store);
                  verifyAbsent(store);
                  try (OutputStream output = Files.newOutputStream(path)) {
                      store.store(output, PASSWORD);
                  }

                  // Reload the written bytes so write/format errors cannot be mistaken for success.
                  verifyAbsent(load(path, type));
                  System.err.println("Removed " + removed + " impacted certificate(s); both target subjects are absent.");
                  System.out.println(type);
              }
          }
          JAVA

          "$JAVA_HOME/bin/javac" -d "$RUNNER_TEMP" "$RUNNER_TEMP/RemoveImpactedTrustAnchors.java"
          store_type="$("$JAVA_HOME/bin/java" -cp "$RUNNER_TEMP" RemoveImpactedTrustAnchors "$truststore")"
          case "$store_type" in
            JKS|PKCS12) ;;
            *) echo "::error::Truststore helper returned an unsupported format" >&2; exit 1 ;;
          esac

          tool_options="${JAVA_TOOL_OPTIONS-}"
          tool_options="${tool_options:+$tool_options }-Djavax.net.ssl.trustStore=$truststore -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=$store_type"
          printf 'JAVA_TOOL_OPTIONS=%s\n' "$tool_options" >>"$GITHUB_ENV"

      - name: Validate wrapper and configure Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          validate-wrappers: true
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/master' }}
          cache-cleanup: on-success
          dependency-graph: disabled

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          # Disable pipefail temporarily because 'yes' exits with SIGPIPE (exit code 141)
          # which would otherwise fail the pipeline when pipefail is enabled.
          set +o pipefail
          yes | "$sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          set -o pipefail

      - name: Audit source publication readiness
        run: ./scripts/check-publication-readiness.py

      - name: Verify official build fails closed without signing configuration
        shell: bash
        env:
          RELEASE_SIGNING_PROPERTIES_FILE: ""
          RELEASE_STORE_FILE: ""
          RELEASE_STORE_PASSWORD: ""
          RELEASE_KEY_ALIAS: ""
          RELEASE_KEY_PASSWORD: ""
          ORG_GRADLE_PROJECT_RELEASE_SIGNING_PROPERTIES_FILE: ""
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ""
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ""
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ""
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/verified-release-negative.log"
          set +e
          ./gradlew --no-daemon --no-configuration-cache :app:verifiedRelease >"$log" 2>&1
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "verifiedRelease unexpectedly succeeded without signing configuration" >&2
            exit 1
          fi
          if ! grep -Fq "verifiedRelease requires external release signing configuration" "$log"; then
            echo "verifiedRelease failed for an unexpected reason" >&2
            sed -n '1,160p' "$log" >&2
            exit 1
          fi
          if find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit 2>/dev/null | grep -q .; then
            echo "verifiedRelease produced an artifact before failing closed" >&2
            exit 1
          fi
          rm -f "$log"

      - name: Test, lint, and build unsigned contributor artifacts
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          test lintDebug lintRelease assembleDebug assembleRelease bundleRelease

      - name: Audit built artifacts
        run: ./scripts/check-publication-readiness.py --require-artifacts

      - name: Confirm contributor release APK is unsigned
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name 'PixelifyInfinity-*-release-unsigned.apk' -print -quit)"
          test -n "$apk"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"; then
            echo "Contributor release APK unexpectedly has a signature" >&2
            exit 1
          fi

      - name: Scan complete Git history for secrets
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --silent --show-error --location --output "$archive" "$url"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner
          rm -f gitleaks "$archive"
