name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pin the exact JDK release: the truststore policy below is verified
      # against Temurin 17.0.21+9, and a moving "17" could silently reintroduce
      # the incident anchors or change cacerts contents.
      - name: Set up JDK 17 (Temurin 17.0.21+9)
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17.0.21+9"
          check-latest: false

      - name: Verify pinned JDK toolchain
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          for tool in java javac keytool; do
            if [[ ! -x "$JAVA_HOME/bin/$tool" ]]; then
              echo "::error::$JAVA_HOME/bin/$tool is missing; the tests must not skip"
              exit 1
            fi
          done
          cacerts="$JAVA_HOME/lib/security/cacerts"
          if [[ ! -f "$cacerts" || ! -r "$cacerts" ]]; then
            echo "::error::$cacerts is missing or unreadable; the tests must not skip"
            exit 1
          fi
          runtime="$("$JAVA_HOME/bin/java" -XshowSettings:properties -version 2>&1 \
            | sed -n 's/^ *java.runtime.version = //p')"
          if [[ "$runtime" != "17.0.21+9" ]]; then
            echo "::error::expected Temurin runtime 17.0.21+9, found ${runtime:-<unknown>}"
            exit 1
          fi

      - name: Test JDK truststore hardening tool
        timeout-minutes: 15
        run: python3 -m unittest tests.test_jdk_truststore -v

      - name: Harden CI JDK truststore
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          : "${GITHUB_ENV:?GITHUB_ENV is required}"
          ./scripts/harden-jdk-truststore.sh \
            --out-store "$RUNNER_TEMP/ci-cacerts" \
            --out-env "$GITHUB_ENV"

      - name: Verify hardened truststore is the effective JSSE store
        timeout-minutes: 5
        run: ./scripts/harden-jdk-truststore.sh --verify-only

      - name: Probe public TLS with the hardened truststore
        timeout-minutes: 5
        run: ./scripts/harden-jdk-truststore.sh --probe-tls

      - name: Validate wrapper and configure Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          validate-wrappers: true
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/master' }}
          cache-cleanup: on-success
          dependency-graph: disabled

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          # Disable pipefail temporarily because 'yes' exits with SIGPIPE (exit code 141)
          # which would otherwise fail the pipeline when pipefail is enabled.
          set +o pipefail
          yes | "$sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          set -o pipefail

      - name: Audit source publication readiness
        run: ./scripts/check-publication-readiness.py

      - name: Verify official build fails closed without signing configuration
        shell: bash
        env:
          RELEASE_SIGNING_PROPERTIES_FILE: ""
          RELEASE_STORE_FILE: ""
          RELEASE_STORE_PASSWORD: ""
          RELEASE_KEY_ALIAS: ""
          RELEASE_KEY_PASSWORD: ""
          ORG_GRADLE_PROJECT_RELEASE_SIGNING_PROPERTIES_FILE: ""
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ""
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ""
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ""
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/verified-release-negative.log"
          set +e
          ./gradlew --no-daemon --no-configuration-cache :app:verifiedRelease >"$log" 2>&1
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "verifiedRelease unexpectedly succeeded without signing configuration" >&2
            exit 1
          fi
          if ! grep -Fq "verifiedRelease requires external release signing configuration" "$log"; then
            echo "verifiedRelease failed for an unexpected reason" >&2
            sed -n '1,160p' "$log" >&2
            exit 1
          fi
          if find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit 2>/dev/null | grep -q .; then
            echo "verifiedRelease produced an artifact before failing closed" >&2
            exit 1
          fi
          rm -f "$log"

      - name: Test, lint, and build unsigned contributor artifacts
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          test lintDebug lintRelease assembleDebug assembleRelease bundleRelease

      - name: Audit built artifacts
        run: ./scripts/check-publication-readiness.py --require-artifacts

      - name: Confirm contributor release APK is unsigned
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name 'PixelifyInfinity-*-release-unsigned.apk' -print -quit)"
          test -n "$apk"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"; then
            echo "Contributor release APK unexpectedly has a signature" >&2
            exit 1
          fi

      - name: Scan complete Git history for secrets
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --silent --show-error --location --output "$archive" "$url"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner
          rm -f gitleaks "$archive"
